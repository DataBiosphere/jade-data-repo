name: Build, tag, and publish
env:
  # This must be defined for the bash redirection
  GOOGLE_APPLICATION_CREDENTIALS: 'jade-dev-account.json'
  # This must be defined for the bash redirection
  GOOGLE_SA_CERT: 'jade-dev-account.pem'
on:
  workflow_dispatch: {}
  pull_request:
  push:
    branches:
      - develop
jobs:
  bump_version:
    # Skip entire workflow if commit is authored by broadbot
    # broadbot is only used for automated commits, like version bumps
    # We don't want to trigger a version bump/deploy to dev for those
    if: ${{ !contains( github.event.sender.login, 'broadbot') }}
    uses: ./.github/workflows/tag.yml
    with:
      # The 'ref' parameter ensures that the provider version is postfixed with the HEAD commit of the PR branch,
      # facilitating cross-referencing of a pact between Sherlock and GitHub.
      ref: ${{ github.head_ref || '' }}
      release-branches: ${{ github.event.repository.default_branch }}
    secrets: inherit

  build_client_and_publish:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    needs:
      - bump_version
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - name: Checkout tagged branch of jade-data-repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.tag }}
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: 'projects/1038484894585/locations/global/workloadIdentityPools/github-wi-pool/providers/github-wi-provider'
          service_account: 'dsp-artifact-registry-push@dsp-artifact-registry.iam.gserviceaccount.com'
      - name: Publish client to GAR
        run: ./gradlew publish
        env:
          ENABLE_SUBPROJECT_TASKS: 'true'
          GOOGLE_CLOUD_PROJECT: dsp-artifact-registry
          GAR_LOCATION: us-central1
          GAR_REPOSITORY_ID: libs-snapshot-standard

  build_container_and_publish:
    runs-on: ubuntu-latest
    needs:
      - bump_version
    steps:
      - name: Determine image build checkout tag
        id: image_build_checkout_tag
        run: |
          # For PR builds, checkout the HEAD ref, for builds on the default branch,
          # checkout the most recently bumped semver tag.
          if [ ${{ github.ref_name }} == ${{ github.event.repository.default_branch }} ]; then
            echo "checkout_ref=${{ needs.bump_version.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "checkout_ref=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout jade-data-repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.image_build_checkout_tag.outputs.checkout_ref }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: 'Release Candidate Container Build: Create release candidate images'
        run: |
          # extract service account credentials
          base64 --decode <<< ${{ secrets.SA_B64_CREDENTIALS }} > ${GOOGLE_APPLICATION_CREDENTIALS}
          jq -r .private_key ${GOOGLE_APPLICATION_CREDENTIALS} > ${GOOGLE_SA_CERT}
          chmod 644 ${GOOGLE_SA_CERT}
          # Build, tag and push the image
          ./gradlew jib
        env:
          GCR_TAG: ${{ needs.bump_version.outputs.tag }}

  get-branch-name:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    needs:
      - bump_version
    outputs:
      branch-name: ${{ steps.determine-branch-name.outputs.branch-name }}
    steps:
      - name: Determine branch name
        id: determine-branch-name
        run: |
          # Get the branch name and replace any '/'s with '_'s
          BRANCH_NAME="${GITHUB_HEAD_REF//[\/]/_}"
          echo "Branch name: ${BRANCH_NAME}"
          echo "branch-name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
        shell: bash

  tag-image-with-branch-name:
    if: github.ref_name != github.event.repository.default_branch
    needs:
      - bump_version
      - build_container_and_publish
      - get-branch-name
    uses: ./.github/workflows/cherry-pick-image.yaml
    secrets: inherit
    with:
      source_gcr_url: 'gcr.io/broad-jade-dev/jade-data-repo'
      source_gcr_tag: ${{ needs.bump_version.outputs.tag }}
      target_gcr_url: 'gcr.io/broad-jade-dev/jade-data-repo'
      target_gcr_tag: ${{ needs.get-branch-name.outputs.branch-name }}

  cherry_pick_image_to_production_gcr:
    if: github.ref_name == github.event.repository.default_branch
    needs:
      - bump_version
      - build_container_and_publish
    uses: ./.github/workflows/cherry-pick-image.yaml
    secrets: inherit
    with:
      source_gcr_url: 'gcr.io/broad-jade-dev/jade-data-repo'
      source_gcr_tag: ${{ needs.bump_version.outputs.tag }}
      target_gcr_url: 'gcr.io/datarepo-public-gcr/jade-data-repo'
      target_gcr_tag: ${{ needs.bump_version.outputs.tag }}

  report-to-sherlock:
    name: Report App Version to Sherlock
    uses: broadinstitute/sherlock/.github/workflows/client-report-app-version.yaml@main
    needs:
      - bump_version
      - build_container_and_publish
    with:
      new-version: ${{ needs.bump_version.outputs.tag }}
      chart-name: datarepo
    permissions:
      contents: read
      id-token: write

  report-workflow:
    name: Report workflow status on dev release
    if: github.ref_name == github.event.repository.default_branch
    uses: broadinstitute/sherlock/.github/workflows/client-report-workflow.yaml@main
    # dependency is not required but makes the action run page more readable
    needs:
      - build_container_and_publish
    with:
      relates-to-chart-releases: 'datarepo-dev'
      notify-slack-channels-upon-workflow-failure: ${{ vars.SLACK_NOTIFICATION_CHANNELS }}
      notify-slack-channels-upon-workflow-retry: ${{ vars.SLACK_NOTIFICATION_CHANNELS }}
    permissions:
      id-token: write

  set-app-version-in-dev:
    uses: broadinstitute/sherlock/.github/workflows/client-set-environment-app-version.yaml@main
    if: github.ref_name == github.event.repository.default_branch
    needs:
      - bump_version
      - report-to-sherlock
    with:
      new-version: ${{ needs.bump_version.outputs.tag }}
      chart-name: datarepo
      environment-name: dev
    secrets:
      sync-git-token: ${{ secrets.BROADBOT_TOKEN }}
    permissions:
      id-token: write
